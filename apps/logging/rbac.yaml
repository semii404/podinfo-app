apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-cron-sa
  namespace: script-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: list-nodes-role
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bind-node-cron
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: list-nodes-role
subjects:
- kind: ServiceAccount
  name: node-cron-sa
  namespace: script-runner
