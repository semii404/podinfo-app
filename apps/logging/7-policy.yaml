apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: enforce-mtls
spec:
  endpointSelector:
    matchExpressions:
      # Apply to all pods except those in kube-system namespace
      - key: "k8s:io.kubernetes.pod.namespace"
        operator: NotIn
        values:
          - kube-system

  ingress:
  # Allow inbound only on port 443 from any source
  - fromEndpoints:
    - matchLabels: {}
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP

  egress:
  # ✅ Allow DNS for these namespaces (still allow talking to kube-dns)
  - toEndpoints:
    - matchLabels:
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
        - port: "53"
          protocol: UDP
        - port: "53"
          protocol: TCP
      rules:
        dns:
        - matchPattern: "*"

  # ✅ Allow HTTPS (443) to any destination
  - toPorts:
    - ports:
        - port: "443"
          protocol: TCP
