apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging-deployment
  namespace: script-runner  # Ensure this matches your desired namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logging  # Match the label in spec.template.metadata.labels
  template:
    metadata:
      labels:
        app: logging  # This label must match the selector above
    spec:
      containers:
        - name: logging-container
          image: ubuntu:22.04  # Replace with your actual Docker image
          command:
            - /bin/sh
            - -c
            - |
              # Ensure the script is executable
              chmod +x /usr/local/bin/logging-script.sh

              # Run the script infinitely (in the foreground)
              while true; do
                /usr/local/bin/logging-script.sh  # Run the original script
                sleep 5  # Sleep to avoid rapid execution
              done
          volumeMounts:
            - name: script-volume
              mountPath: /usr/local/bin/logging-script.sh  # Path inside the container
              subPath: logging-script.sh  # File from ConfigMap
      volumes:
        - name: script-volume
          configMap:
            name: logging-script-config  # Refers to the ConfigMap generated by Kustomize
