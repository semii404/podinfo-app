apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging-deployment
  namespace: script-runner 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-cron 
  template:
    metadata:
      labels:
        app: node-cron 
    spec:
      containers:
        - name: node-cron-container
          image: ubuntu:latest  
          command:
          - /bin/bash
          - -c
          - |
            cat /usr/local/bin/logging-script.sh >> /usr/local/bin/ensure-ip.sh

            # Make the new script executable
            chmod +x /usr/local/bin/ensure-ip.sh
              
            # Run the newly created script in the background
            /usr/local/bin/ensure-ip.sh
            while true; do sleep 3600; done  # Keep the container alive

          volumeMounts:
            - name: script-volume
              mountPath: /usr/local/bin/logging-script.sh  
              subPath: logging-script.sh 
      volumes:
        - name: script-volume
          configMap:
            name: logging-script-config
