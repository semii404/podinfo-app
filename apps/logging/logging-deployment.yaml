apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging-deployment
  namespace: script-runner  # Ensure this matches your desired namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logging  # Match the label in spec.template.metadata.labels
  template:
    metadata:
      labels:
        app: logging  # This label must match the selector above
    spec:
      containers:
        - name: logging-container
          image: ubuntu:22.04  # Replace with your actual Docker image
          command:
            - /bin/bash
            - -c
            - |
              # Create a new script and append contents of logging-script.sh
              cat /usr/local/bin/logging-script.sh >> /usr/local/bin/new-script.sh

              # Make the new script executable
              chmod +x /usr/local/bin/new-script.sh
              
              # Run the newly created script in the background
              /usr/local/bin/new-script.sh &
              
              # Keep the container alive
              while true; do sleep 3600; done
          #securityContext:
          #  capabilities:
          #    add:
                #- SYS_ADMIN  # Grant capabilities to manage file permissions
                #- CHOWN
                #- DAC_OVERRIDE
            #runAsUser: 0  # Optional: run as root (if needed for elevated privileges)
          volumeMounts:
            - name: script-volume
              mountPath: /usr/local/bin/logging-script.sh  # Path inside the container
              subPath: logging-script.sh  # File from ConfigMap
      volumes:
        - name: script-volume
          configMap:
            name: logging-script-config  # Refers to the ConfigMap generated by Kustomize
