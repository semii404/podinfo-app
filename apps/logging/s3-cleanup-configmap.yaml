apiVersion: v1
kind: ConfigMap
metadata:
  name: s3-cleanup-script
  namespace: logging
data:
  delete_old_s3_objects.py: |
    import boto3

    def list_buckets():
        try:
            s3 = boto3.client('s3')
            response = s3.list_buckets()

            print("S3 Buckets in your account:")
            for bucket in response['Buckets']:
                print(f"- {bucket['Name']}")
        except Exception as e:
            print(f"Error listing S3 buckets: {e}")

    if __name__ == "__main__":
        list_buckets()

