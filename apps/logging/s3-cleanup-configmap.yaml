apiVersion: v1
kind: ConfigMap
metadata:
  name: s3-cleanup-script
  namespace: logging
data:
  delete_old_s3_objects.py: |
    import boto3
    from datetime import datetime, timezone, timedelta
    import os

    # Configurable values
    BUCKET_NAME = os.getenv('BUCKET_NAME')  # Pass via env or set default below
    DAYS_OLD = int(os.getenv('DAYS_OLD', '30'))  # Default to 30 days

    def delete_old_objects(bucket_name, days_old):
        s3 = boto3.client('s3')
        threshold_date = datetime.now(timezone.utc) - timedelta(days=days_old)

        try:
            response = s3.list_objects_v2(Bucket=bucket_name)
            if 'Contents' not in response:
                print(f"No objects found in bucket {bucket_name}")
                return

            for obj in response['Contents']:
                key = obj['Key']
                last_modified = obj['LastModified']

                if last_modified < threshold_date:
                    print(f"Deleting {key} (Last Modified: {last_modified})")
                    s3.delete_object(Bucket=bucket_name, Key=key)
                else:
                    print(f"Skipping {key} (Last Modified: {last_modified})")

        except Exception as e:
            print(f"Error processing bucket: {e}")

    if __name__ == "__main__":
        if not BUCKET_NAME:
            print("Error: BUCKET_NAME environment variable is not set")
        else:
            delete_old_objects(BUCKET_NAME, DAYS_OLD)


